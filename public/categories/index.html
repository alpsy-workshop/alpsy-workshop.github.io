    if (!nav) return;
    
    nav.classList.add("js-nav");

    function setOpen(el, button, open) {
      el.classList.toggle("is-open", open);
      button.setAttribute("aria-expanded", open ? "true" : "false");
    }

    var toggle = nav.querySelector(".nav-toggle");
    toggle.addEventListener("click", function () {
      setOpen(nav, toggle, !nav.classList.contains("is-open"));
    });

    var dropdowns = Array.prototype.slice.call(nav.querySelectorAll(".nav-dropdown"));
    function closeDropdowns(except) {
      dropdowns.forEach(function (dd) {
        if (dd !== except) setOpen(dd, dd.querySelector(".nav-dropdown-toggle"), false);
      });
    }
    dropdowns.forEach(function (dd) {
      var button = dd.querySelector(".nav-dropdown-toggle");
      button.addEventListener("click", function () {
        closeDropdowns(dd);
        setOpen(dd, button, !dd.classList.contains("is-open"));
      });
    });

    
    document.addEventListener("click", function (e) {
      dropdowns.forEach(function (dd) {
        if (!dd.contains(e.target)) setOpen(dd, dd.querySelector(".nav-dropdown-toggle"), false);
      });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDropdowns(null);
    });
  })();
